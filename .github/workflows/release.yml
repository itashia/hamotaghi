name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate, format, version, and prepare release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_sha: ${{ steps.release_commit.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libfuse2 patchelf

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          composer install --working-dir=backend --no-interaction --prefer-dist --optimize-autoloader
          cp backend/.env.example backend/.env
          (cd backend && php artisan key:generate --force)

      - name: Apply safe automatic formatting
        run: |
          bun run format
          bun run icons
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          (cd backend && vendor/bin/pint --format agent)

      - name: Commit formatting and generated icon fixes
        id: format_commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No automatic fixes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github scripts src index.html package.json bun.lock README.md public src-tauri
          git commit -m "chore: apply automated formatting and generated assets [skip ci]"
          git push origin HEAD:main

      - name: Verify quality gates
        run: |
          bun run format:check
          bun test
          bun run build
          (cd backend && vendor/bin/pint --test --format agent && php artisan test --compact)
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Determine next semantic version
        id: version
        run: node scripts/next-version.mjs >> "$GITHUB_OUTPUT"

      - name: Synchronize release version
        if: steps.version.outputs.should_release == 'true'
        run: |
          node scripts/sync-version.mjs "${{ steps.version.outputs.version }}"
          bunx prettier --write package.json src-tauri/tauri.conf.json

      - name: Commit synchronized release version
        id: release_commit
        if: steps.version.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          if git diff --cached --quiet; then
            echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(release): prepare ${{ steps.version.outputs.tag }} [skip ci]"
          git push origin HEAD:main
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            target: ""
            args: ""
          - name: windows
            os: windows-latest
            target: ""
            args: ""
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libfuse2 patchelf

      - run: bun install --frozen-lockfile
      - run: bun run icons
      - run: bun run tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: hamotaghi-${{ matrix.name }}-${{ needs.prepare.outputs.version }}
          path: ${{ matrix.target != '' && format('src-tauri/target/{0}/release/bundle', matrix.target) || 'src-tauri/target/release/bundle' }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_sha }}

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: hamotaghi-*

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git fetch --tags --force
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" "${{ needs.prepare.outputs.release_sha }}" -m "Release $TAG"
            git push origin "$TAG"
          fi
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "Hamotaghi $TAG" --generate-notes
          fi
